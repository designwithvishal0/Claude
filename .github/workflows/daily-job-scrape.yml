name: Daily job scrape

on:
  schedule:
    # 06:17 UTC daily — off the hour to avoid the scheduler's top-of-hour pileup.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scraper
        working-directory: job-scraper
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          JOB_QUERY: ${{ vars.JOB_QUERY }}
          JOB_COUNTRIES: ${{ vars.JOB_COUNTRIES }}
          JOB_MAX_AGE_HOURS: "24"
        run: node src/index.mjs

      - name: Commit updated job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new jobs — nothing to commit."
          else
            git commit -m "chore: daily job feed update ($(date -u +%Y-%m-%d))"
            git push
          fi
