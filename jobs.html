let activeSource = 'all';

function sourceBadge(source) {
  if (source === 'indeed') return '<span class="badge bg-blue-50 text-blue-700">Indeed</span>';
  return '<span class="badge bg-green-50 text-green-700">ZipRecruiter</span>';
}

function typeBadge(type) {
  if (!type) return '';
  const isRemote = type.toLowerCase().includes('remote');
  const color = isRemote ? 'bg-brand-50 text-brand-700' : 'bg-surface-muted text-ink-500';
  return `<span class="badge ${color}">${type}</span>`;
}

function renderCards(jobs) {
  const grid = document.getElementById('job-grid');
  document.getElementById('count-label').textContent = `${jobs.length} job${jobs.length !== 1 ? 's' : ''}`;
  if (jobs.length === 0) {
    grid.innerHTML = `<div class="col-span-3 text-center py-16 text-ink-300 text-sm">No jobs found for this filter.</div>`;
    return;
  }
  grid.innerHTML = jobs.map(j => `
    <div class="bg-white rounded-xl border border-surface-border p-5 flex flex-col gap-3 hover:shadow-sm transition-shadow">
      <div class="flex items-start justify-between gap-2">
        <div class="flex-1 min-w-0">
          <a href="${j.url}" target="_blank" rel="noopener noreferrer"
             class="text-sm font-semibold text-ink-900 hover:text-brand-600 leading-snug block">
            ${j.title}
          </a>
          <p class="text-xs text-ink-500 mt-0.5">${j.company}</p>
        </div>
        ${sourceBadge(j.source)}
      </div>

      <div class="flex flex-wrap gap-1.5">
        ${j.type ? typeBadge(j.type) : ''}
        <span class="badge bg-surface-muted text-ink-500">
          <svg class="w-3 h-3 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          ${j.location}
        </span>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-surface-border">
        <span class="text-xs font-semibold text-ink-700">${j.salary || '—'}</span>
        <div class="flex items-center gap-2">
          ${j.posted ? `<span class="text-xs text-ink-300">${j.posted}</span>` : ''}
          <a href="${j.url}" target="_blank" rel="noopener noreferrer"
             class="text-xs font-medium text-brand-600 hover:text-brand-700">
            Apply →
          </a>
        </div>
      </div>
      ${j.benefits ? `<p class="text-xs text-ink-300 -mt-1">Benefits: ${j.benefits}</p>` : ''}
    </div>
  `).join('');
}

function filterSource(src) {
  activeSource = src;
  ['all','indeed','ziprecruiter'].forEach(s => {
    const btn = document.getElementById(`btn-${s}`);
    if (s === src) {
      btn.className = 'px-3 py-1.5 bg-brand-600 text-white';
    } else {
      btn.className = 'px-3 py-1.5 text-ink-500 hover:bg-surface-muted';
    }
  });
  const filtered = src === 'all' ? JOBS : JOBS.filter(j => j.source === src);
  renderCards(filtered);
}
